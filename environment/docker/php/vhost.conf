<VirtualHost *:80>
    DocumentRoot ${APACHE_DOCUMENT_ROOT}
    DirectoryIndex index.php index.html

    <Directory ${APACHE_DOCUMENT_ROOT}>
        Options -Indexes +FollowSymLinks
        # Requerido por el .htaccess de la sesión 5
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
